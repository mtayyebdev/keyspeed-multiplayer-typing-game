<!doctype html>
<html lang="en" data-theme="midnight">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/logo.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>KeySpeed - Multiplayer Typing Game</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;700&family=Outfit:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <script>
      (function() {
        try {
          var saved = localStorage.getItem('keyspeed_theme') || localStorage.getItem('typearena_theme');
          var validThemes = ['light', 'midnight', 'terminal', 'sand'];
          var theme = validThemes.indexOf(saved) !== -1 ? saved : 'midnight';
          document.documentElement.setAttribute('data-theme', theme);
        } catch (e) {
          document.documentElement.setAttribute('data-theme', 'midnight');
        }
      })();
    </script>
  </head>
  <body class="bg-bg text-fg min-h-screen font-['Outfit',sans-serif] antialiased selection:bg-accent/20 selection:text-accent">
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
