services:
  mongodb:
    image: mongo:7.0
    container_name: keyspeed-mongodb
    restart: unless-stopped
    ports:
      - "27017:27017"
    environment:
      MONGO_INITDB_DATABASE: keyspeed
    volumes:
      - mongo-data:/data/db
    networks:
      - keyspeed-network
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./keyspeed-backend
      dockerfile: Dockerfile
    container_name: keyspeed-backend
    restart: unless-stopped
    ports:
      - "3001:3001"
    environment:
      PORT: 3001
      MONGODB_URI: mongodb://mongodb:27017/keyspeed
      JWT_SECRET: ${JWT_SECRET:-Hkdh294$sa2478HKKPQWIsadh091sn2301@jsadUALXMasjdmx*234Mdksjd123810444NALQPqp628}
      JWT_EXPIRES_IN: 7d
      FRONTEND_URL: ${FRONTEND_URL:-http://localhost:8080}
      ADMIN_EMAIL: ${ADMIN_EMAIL:-admin@keyspeed.com}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-AdminPass123!}
      NODE_ENV: production
    depends_on:
      mongodb:
        condition: service_healthy
    networks:
      - keyspeed-network

  frontend:
    build:
      context: ./keyspeed-frontend
      dockerfile: Dockerfile
      args:
        VITE_API_URL: ${VITE_API_URL:-http://localhost:3001/api}
        VITE_SOCKET_URL: ${VITE_SOCKET_URL:-http://localhost:3001}
    container_name: keyspeed-frontend
    restart: unless-stopped
    ports:
      - "8080:80"
    depends_on:
      - backend
    networks:
      - keyspeed-network

networks:
  keyspeed-network:
    driver: bridge

volumes:
  mongo-data:
    driver: local

